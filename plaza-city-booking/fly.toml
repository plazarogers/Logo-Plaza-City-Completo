# Ejemplo para Fly.io (https://fly.io). Ajusta app y region.
app = "plaza-city-booking"
primary_region = "dfw"   # Dallas: la más cercana a Houston/Spring, TX

[build]

[env]
  NODE_ENV = "production"
  PORT = "3000"
  DB_PATH = "/app/data/plaza-city.db"
  BASE_URL = "https://plaza-city-booking.fly.dev"

[[mounts]]
  source = "plaza_data"
  destination = "/app/data"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = false   # el scheduler de no-show debe correr siempre
  auto_start_machines = true
  min_machines_running = 1

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
